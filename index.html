<!doctype html>
<!-- 고정 주소 안내 페이지 — PIN으로 u.json 의 암호화된 터널 주소를 풀어 바로 넘긴다 (github.io 에 공개, remote.py 가 u.json 갱신) -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>딸깍 이미지</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 360px; margin: 18vh auto 0; padding: 0 16px; text-align: center; }
  input, button { font-size: 18px; padding: 12px; width: 100%; box-sizing: border-box; margin-top: 10px; border-radius: 10px; border: 1px solid #8886; }
  button { background: #2b7; color: #fff; border: 0; }
  #msg { margin-top: 14px; min-height: 1.4em; }
  small { opacity: .6; }
</style>
</head>
<body>
<h2>딸깍 이미지</h2>
<form id="f" hidden>
  <input id="pin" type="password" placeholder="PIN" autocomplete="current-password" autofocus>
  <button>열기</button>
</form>
<div id="msg">주소 확인 중…</div>
<small id="at"></small>
<script>
const KEY = "ddk_pin";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const store = { get() { try { return localStorage.getItem(KEY); } catch { return null; } },
                set(v) { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch {} } };

// remote.py 의 seal() 과 같은 방식: PBKDF2-SHA256 60만 번 → AES-GCM
async function open_(sealed, pin) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: b64(sealed.salt), iterations: 600000 },
                                            base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(sealed.iv) }, key, b64(sealed.ct));
  return new TextDecoder().decode(plain);
}

(async () => {
  const msg = document.getElementById("msg"), form = document.getElementById("f");
  let sealed;
  try {
    sealed = await (await fetch("u.json?t=" + Date.now(), { cache: "no-store" })).json();
  } catch { msg.textContent = "주소 파일을 못 읽었어요. 잠시 뒤 새로고침하세요."; return; }
  document.getElementById("at").textContent = "주소 갱신: " + sealed.at;

  async function go(pin) {
    msg.textContent = "여는 중…";
    try { const url = await open_(sealed, pin); store.set(pin); location.replace(url); return true; }
    catch { return false; }
  }
  const saved = store.get();
  if (saved && await go(saved)) return;
  store.set(null);  // PIN 이 바뀌었으면 기억한 것을 지운다
  form.hidden = false; msg.textContent = "";
  form.onsubmit = async e => {
    e.preventDefault();
    if (!await go(document.getElementById("pin").value)) msg.textContent = "PIN이 틀렸어요";
  };
})();
</script>
</body>
</html>
